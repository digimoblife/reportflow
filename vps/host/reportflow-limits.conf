# ReportFlow: rate-limit zones (names prefixed so they cannot clash with other sites).
map $uri $reportflow_login_key {
    default "";
    ~^/auth/ $binary_remote_addr;
    ~^/admin/login $binary_remote_addr;
}
limit_req_zone $reportflow_login_key zone=reportflow_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=reportflow_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=reportflow_perip:10m;
